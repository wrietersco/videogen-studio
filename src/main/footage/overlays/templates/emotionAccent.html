<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>emotionAccent</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict'
  var params = window.__params || {}
  var meta = window.__meta || { width: 1080, height: 1920, durationSec: 4 }
  var W = Math.max(2, Math.round(meta.width))
  var H = Math.max(2, Math.round(meta.height))
  var D = Math.max(0.1, Number(meta.durationSec) || 4)
  var canvas = document.getElementById('stage')
  canvas.width = W
  canvas.height = H
  var ctx = canvas.getContext('2d')

  function fade(t) {
    return Math.max(0, Math.min(1, t / 0.3, (D - t) / 0.3))
  }
  function hash(s) {
    var h = 2166136261
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i)
      h = Math.imul(h, 16777619)
    }
    return h >>> 0
  }
  function mulberry32(seed) {
    var a = seed >>> 0
    return function () {
      a = (a + 0x6d2b79f5) >>> 0
      var t = a
      t = Math.imul(t ^ (t >>> 15), t | 1)
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296
    }
  }
  function hexToRgb(hex) {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex).trim())
    if (!m) return null
    var s = m[1]
    if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2]
    return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)]
  }

  var emotion = String(params.emotion == null ? '' : params.emotion).trim().toLowerCase() || 'calm'
  var HUES = { anger: 4, love: 338, empathy: 210, compassion: 190, joy: 46, sadness: 214, fear: 272, surprise: 296, calm: 172, tension: 18 }
  var rgb = params.color != null ? hexToRgb(params.color) : null
  var hue = rgb
    ? (Math.atan2(Math.sqrt(3) * (rgb[1] - rgb[2]), 2 * rgb[0] - rgb[1] - rgb[2]) * 180) / Math.PI
    : HUES[emotion] != null ? HUES[emotion] : hash(emotion) % 360

  function wash(alpha) {
    return rgb
      ? 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + alpha + ')'
      : 'hsla(' + Math.round((hue + 360) % 360) + ',62%,55%,' + alpha + ')'
  }

  // deterministic particle field: positions advance linearly with t
  var COUNT = 22
  var rnd = mulberry32(hash(emotion + '|vg'))
  var bits = []
  for (var i = 0; i < COUNT; i++) {
    bits.push({
      x: rnd(),
      y: rnd(),
      vx: (rnd() - 0.5) * 0.05,
      vy: (rnd() - 0.5) * 0.035,
      r: 0.006 + rnd() * 0.02,
      base: 0.1 + rnd() * 0.22,
      speed: 0.4 + rnd() * 1.1,
      phase: rnd() * Math.PI * 2
    })
  }

  window.renderAt = function (t) {
    ctx.clearRect(0, 0, W, H)
    var a = fade(t)
    if (a <= 0) return
    var diag = Math.max(W, H)

    // soft colour wash across the frame, breathing slowly
    var breath = 0.85 + 0.15 * Math.sin(t * 0.9)
    var g1 = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, diag * 0.75)
    g1.addColorStop(0, wash(0.16 * a * breath))
    g1.addColorStop(1, wash(0))
    ctx.fillStyle = g1
    ctx.fillRect(0, 0, W, H)
    var g2 = ctx.createRadialGradient(W * 0.2, H * 0.85, 0, W * 0.2, H * 0.85, diag * 0.6)
    g2.addColorStop(0, wash(0.1 * a * (2 - breath)))
    g2.addColorStop(1, wash(0))
    ctx.fillStyle = g2
    ctx.fillRect(0, 0, W, H)

    // particle-like shapes drifting on linear paths, alpha pulsing
    for (var i = 0; i < bits.length; i++) {
      var p = bits[i]
      var x = (((p.x + p.vx * t) % 1) + 1) % 1
      var y = (((p.y + p.vy * t) % 1) + 1) % 1
      var r = p.r * diag
      var pulse = 0.5 + 0.5 * Math.sin(t * p.speed + p.phase)
      var alpha = p.base * pulse * a
      if (alpha < 0.004) continue
      var pg = ctx.createRadialGradient(x * W, y * H, 0, x * W, y * H, r)
      pg.addColorStop(0, wash(alpha))
      pg.addColorStop(1, wash(0))
      ctx.fillStyle = pg
      ctx.beginPath()
      ctx.arc(x * W, y * H, r, 0, Math.PI * 2)
      ctx.fill()
    }
  }
})()
</script>
</body>
</html>
