<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>statChip</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict'
  var params = window.__params || {}
  var meta = window.__meta || { width: 1080, height: 1920, durationSec: 4 }
  var W = Math.max(2, Math.round(meta.width))
  var H = Math.max(2, Math.round(meta.height))
  var D = Math.max(0.1, Number(meta.durationSec) || 4)
  var canvas = document.getElementById('stage')
  canvas.width = W
  canvas.height = H
  var ctx = canvas.getContext('2d')
  var SANS = "-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"

  function fade(t) {
    return Math.max(0, Math.min(1, t / 0.3, (D - t) / 0.3))
  }
  function easeOut(p) {
    p = Math.max(0, Math.min(1, p))
    return 1 - Math.pow(1 - p, 3)
  }
  function clean(v) {
    return String(v == null ? '' : v).replace(/\s+/g, ' ').trim()
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath()
    ctx.moveTo(x + r, y)
    ctx.arcTo(x + w, y, x + w, y + h, r)
    ctx.arcTo(x + w, y + h, x, y + h, r)
    ctx.arcTo(x, y + h, x, y, r)
    ctx.arcTo(x, y, x + w, y, r)
    ctx.closePath()
  }
  function wrap(value, font, maxW, maxLines) {
    ctx.font = font
    var words = value.split(' ').filter(Boolean)
    var lines = []
    var cur = ''
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i]
      if (cur && ctx.measureText(test).width > maxW) {
        lines.push(cur)
        cur = words[i]
      } else cur = test
      if (lines.length === maxLines) break
    }
    if (lines.length < maxLines && cur) lines.push(cur)
    else if (lines.length === maxLines && cur) {
      var last = lines[maxLines - 1]
      while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1).trim()
      lines[maxLines - 1] = last + '…'
    }
    return lines.filter(Boolean)
  }

  var stat = clean(params.stat).slice(0, 12).toUpperCase()
  var label = clean(params.label).slice(0, 160).toUpperCase()

  window.renderAt = function (t) {
    ctx.clearRect(0, 0, W, H)
    if (!stat && !label) return
    var a = fade(t)
    if (a <= 0) return

    var pop = 0.96 + 0.04 * easeOut(Math.min(1, t / 0.45))
    var statSize = H * 0.056
    var labelSize = H * 0.02
    var pad = H * 0.026
    var maxW = W * 0.8

    // measure the pill around its content
    ctx.font = '700 ' + statSize + 'px ' + SANS
    var statW = stat ? ctx.measureText(stat).width : 0
    var labelFont = '600 ' + labelSize + 'px ' + SANS
    var dot0 = Math.max(8, H * 0.011)
    var labelLines = label ? wrap(label, labelFont, maxW - pad * 2 - dot0 - H * 0.014, 2) : []
    var labelW = 0
    for (var i = 0; i < labelLines.length; i++) labelW = Math.max(labelW, ctx.measureText(labelLines[i]).width)
    var dot = Math.max(8, H * 0.011)
    var inner = Math.max(statW, labelW) + dot + H * 0.014
    var chipW = Math.min(maxW, inner + pad * 2)
    var chipH = statSize * 1.1 + (labelLines.length ? labelLines.length * labelSize * 1.3 : 0) + pad * 1.4
    var cx = W / 2
    var cy = H * 0.12 + chipH / 2

    ctx.save()
    ctx.globalAlpha = a
    ctx.translate(cx, cy)
    ctx.scale(pop, pop)
    ctx.translate(-cx, -cy)

    // dark pill
    ctx.save()
    ctx.shadowColor = 'rgba(0,0,0,0.4)'
    ctx.shadowBlur = H * 0.02
    ctx.fillStyle = 'rgba(12,16,22,0.82)'
    roundRect(cx - chipW / 2, cy - chipH / 2, chipW, chipH, chipH / 2)
    ctx.fill()
    ctx.restore()
    // accent dot on the leading edge
    ctx.fillStyle = '#e0aa3e'
    ctx.beginPath()
    ctx.arc(cx - chipW / 2 + pad, cy, dot / 2, 0, Math.PI * 2)
    ctx.fill()

    ctx.textAlign = 'center'
    ctx.textBaseline = 'top'
    var tx = cx + (dot + H * 0.014) / 2 - pad * 0.1
    var ty = cy - chipH / 2 + pad * 0.7
    if (stat) {
      ctx.font = '700 ' + statSize + 'px ' + SANS
      ctx.shadowColor = 'rgba(0,0,0,0.45)'
      ctx.shadowBlur = statSize * 0.12
      ctx.fillStyle = '#ffffff'
      ctx.fillText(stat, tx, ty)
      ty += statSize * 1.1
    }
    if (labelLines.length) {
      ctx.font = labelFont
      ctx.shadowBlur = 0
      ctx.fillStyle = 'rgba(255,255,255,0.72)'
      for (var j = 0; j < labelLines.length; j++) {
        ctx.fillText(labelLines[j], tx, ty)
        ty += labelSize * 1.3
      }
    }
    ctx.restore()
  }
})()
</script>
</body>
</html>
